version: "3.9"

services:
  db:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - shared_buffers=4GB
      - -c
      - effective_cache_size=12GB
      - -c
      - work_mem=32MB
      - -c
      - max_connections=200
      - -c
      - random_page_cost=1.1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB_FILE: /run/secrets/db_name
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - db_password
      - db_name
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "5.0"
          memory: 8G
    networks:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      - "redis-server"
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--protected-mode"
      - "no"
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 300M
    networks:
      - backend
    restart: unless-stopped

  app:
    image: damijanak/social-media-app:latest
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379
      PORT: 3000
      APP_ENV: production
      POOL_CONNECTIONS: 24
      INSTANCE_NAME: "app-instance-1"
    secrets:
      - db_password
      - db_name
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 24
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512M
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
    name: social_media_app_v2_pg_data
    external: true
  redis_data:
    name: social_media_app_v2_redis_data

secrets:
  db_password:
    file: ./secrets/db_password.txt
  db_name:
    file: ./secrets/db_name.txt
